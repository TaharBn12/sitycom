name: نشر على Cloudflare Workers

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: النشر ورفع الأسرار
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # تُرفع كأسرار للـWorker (يجب تعريفها في GitHub Secrets)
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            ECOTRACK_BASE_URL
            ECOTRACK_API_TOKEN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ECOTRACK_BASE_URL: ${{ secrets.ECOTRACK_BASE_URL }}
          ECOTRACK_API_TOKEN: ${{ secrets.ECOTRACK_API_TOKEN }}
