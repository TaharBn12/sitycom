name: نشر على Cloudflare Workers

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      # 1) النشر أولًا — ينشئ الـWorker إن لم يكن موجودًا
      - name: فحص التوكن
        run: |
          echo "ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "verify HTTP $code"
          cat /tmp/verify.json | head -c 600; echo

      - name: نشر الـWorker
        run: npx wrangler deploy 2>&1 | tee /tmp/deploy.log

      # 2) ثم رفع الأسرار المتوفّرة فقط (Ecotrack اختياري)
      - name: رفع الأسرار
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ECOTRACK_BASE_URL: ${{ secrets.ECOTRACK_BASE_URL }}
          ECOTRACK_API_TOKEN: ${{ secrets.ECOTRACK_API_TOKEN }}
        run: |
          node -e '
            const keys = ["SUPABASE_URL","SUPABASE_ANON_KEY","ECOTRACK_BASE_URL","ECOTRACK_API_TOKEN"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            if (!Object.keys(out).length) { console.log("لا توجد أسرار للرفع"); process.exit(0); }
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("سيتم رفع: " + Object.keys(out).join(", "));
          '
          if [ -f /tmp/secrets.json ]; then
            npx wrangler secret bulk /tmp/secrets.json
            rm -f /tmp/secrets.json
          fi

      # 3) إعادة النشر لتفعيل الأسرار الجديدة
      - name: تفعيل الأسرار
        run: npx wrangler deploy

      - name: الرابط
        run: echo "✔ تم النشر — افتح لوحة Cloudflare ← Workers & Pages ← sitycom"
