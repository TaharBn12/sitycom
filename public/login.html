<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sitycom — تسجيل الدخول</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo">س</div>
      <div>
        <h2 style="margin:0" data-i18n="app.name">سيتي كوم</h2>
        <small data-i18n="app.tagline">التجارة الإلكترونية + التوصيل</small>
      </div>
    </div>
    <form id="login-form">
      <div class="field">
        <label data-i18n="login.username">اسم المستخدم</label>
        <input type="text" id="username" autocomplete="username"placeholder="username" required />
      </div>
      <div class="field">
        <label data-i18n="login.password">كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password"placeholder="••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn" data-i18n="login.submit">دخول</button>
      <p class="muted center mt-2" style="font-size:13px"><span data-i18n="login.no_account">ليس لديك حساب؟</span> <a href="register.html" data-i18n="login.create">إنشاء حساب جديد</a></p>
    </form>
    <div class="flex center" style="margin-top:14px">
      <div id="lang-box"></div>
    </div>
    <div class="center mt-2">
      <a href="track.html" data-i18n="nav.public_track">تتبع الزبون</a>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="config.js"></script>
  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
